<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário KYC & Planejamento Financeiro</title>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    
    <!-- pdfmake: Geração robusta de PDF via JSON (Ideal para Mobile/iOS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    
    <style>
        .step { display: none; }
        .step.active { display: block; }

        /* Tooltips */
        .group:focus-within .tooltip-box,
        .group:focus .tooltip-box { display: block; }
        .group { outline: none; }

        /* Área de toque confortável para mobile */
        button, select, input[type="checkbox"], .group > svg { touch-action: manipulation; }
        input[type="checkbox"] { min-width: 20px; min-height: 20px; }
        button { min-height: 44px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-12">

    <header class="bg-gray-900 text-white py-4 px-4 shadow-md mb-6 no-pdf">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight">Formulário de Mapeamento KYC & Risco</h1>
                <p class="text-gray-400 text-xs sm:text-sm">Planejamento Financeiro e Proteção Patrimonial</p>
            </div>
            <span class="bg-gray-800 text-gray-300 text-xs px-3 py-1 rounded-full font-mono border border-gray-700 self-start sm:self-auto">Confidencial</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 sm:px-4">
        <div id="formContainer" class="bg-white rounded-xl shadow-lg border border-gray-200/80 p-4 sm:p-8">

            <div class="no-pdf mb-6 sm:mb-8">
                <div class="flex justify-start sm:justify-between text-xs font-semibold text-gray-500 mb-2 overflow-x-auto gap-4 sm:gap-2 pb-1">
                    <span id="stepLabel1" class="text-blue-600 font-bold whitespace-nowrap">1. Identificação</span>
                    <span id="stepLabel2" class="whitespace-nowrap">2. Saúde & Seguros</span>
                    <span id="stepLabel3" class="whitespace-nowrap">3. Gastos & Padrão</span>
                    <span id="stepLabel4" class="whitespace-nowrap">4. Educação & Passivos</span>
                    <span id="stepLabel5" class="whitespace-nowrap">5. Ativos</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 20%;"></div>
                </div>
            </div>

            <form id="kycForm" onsubmit="return false;">

                <!-- STEP 1: DADOS PESSOAIS & IDENTIFICAÇÃO -->
                <div class="step active" data-step="1">
                    <div class="border-b border-gray-200 pb-3 mb-6">
                        <h2 class="text-lg sm:text-xl font-bold text-gray-900 flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Identificação do Cliente
                        </h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="md:col-span-2 pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                            <input type="text" name="nome" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Digite o nome completo do cliente">
                        </div>
                        <div class="pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">E-mail de Contato</label>
                            <input type="email" name="email" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="cliente@email.com">
                        </div>
                        <div class="pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Telefone / WhatsApp</label>
                            <input type="text" name="telefone" inputmode="tel" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="(00) 00000-0000">
                        </div>
                        <div class="pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Data de Nascimento</label>
                            <input type="date" name="data_nascimento" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div class="pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Profissão / Ocupação</label>
                            <input type="text" name="profissao" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: Engenheiro, Médico, Empresário">
                        </div>
                        <div class="pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Estado Civil</label>
                            <select name="estado_civil" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="">Selecione</option>
                                <option value="Solteiro(a)">Solteiro(a)</option>
                                <option value="Casado(a) - Comunhão Parcial">Casado(a) - Comunhão Parcial</option>
                                <option value="Casado(a) - Separação Total">Casado(a) - Separação Total</option>
                                <option value="Casado(a) - Comunhão Universal">Casado(a) - Comunhão Universal</option>
                                <option value="União Estável">União Estável</option>
                                <option value="Divorciado(a)">Divorciado(a)</option>
                                <option value="Viúvo(a)">Viúvo(a)</option>
                            </select>
                        </div>
                        <div class="pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Número de Dependentes</label>
                            <input type="number" name="dependentes" min="0" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: 2">
                        </div>
                    </div>
                </div>

                <!-- STEP 2: SAÚDE & SEGUROS -->
                <div class="step" data-step="2">
                    <div class="border-b border-gray-200 pb-3 mb-6">
                        <h2 class="text-lg sm:text-xl font-bold text-gray-900 flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.684a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            Saúde
                        </h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <div class="pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Peso</label>
                            <input type="text" name="peso" inputmode="numeric" class="peso-input w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="0 kg">
                        </div>
                        <div class="pdf-field-group">
                            <label class="text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                                Pratica esporte?
                                <div class="relative group inline-block" tabindex="0">
                                    <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-48 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                        Especifique modalidades, frequência ou hobbies esportivos.
                                    </div>
                                </div>
                            </label>
                            <input type="text" name="pratica_esporte" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>

                        <div class="pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Altura</label>
                            <input type="text" name="altura" inputmode="numeric" class="altura-input w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="0 cm">
                        </div>
                        <div class="pdf-field-group">
                            <label class="text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                                Já realizou cirurgia?
                                <div class="relative group inline-block" tabindex="0">
                                    <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-48 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                        Descreva cirurgias prévias relevantes e datas aproximadas.
                                    </div>
                                </div>
                            </label>
                            <input type="text" name="cirurgia" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>

                        <div class="pdf-field-group">
                            <label class="text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                                Como está sua saúde?
                                <div class="relative group inline-block" tabindex="0">
                                    <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-64 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                        Como está a sua saúde? Toma algum medicamento de forma contínua? Qual?
                                    </div>
                                </div>
                            </label>
                            <input type="text" name="como_esta_sua_saude" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div class="flex items-center pt-5 pdf-field-group">
                            <label class="inline-flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" name="fuma" class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                                <span class="text-sm font-medium text-gray-700">Fuma?</span>
                            </label>
                        </div>

                        <div class="pdf-field-group">
                            <label class="text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                                Tem ou teve doença crônica?
                                <div class="relative group inline-block" tabindex="0">
                                    <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-52 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                        Histórico pessoal ou familiar relevante.
                                    </div>
                                </div>
                            </label>
                            <input type="text" name="doenca_cronica" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div class="pdf-field-group">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Vacinas COVID</label>
                            <select name="vacinas_covid" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="">--Nenhum--</option>
                                <option value="1 Dose">1 Dose</option>
                                <option value="2 Doses">2 Doses</option>
                                <option value="3 Doses ou mais">3 Doses ou mais</option>
                                <option value="Não vacinado">Não vacinado</option>
                            </select>
                        </div>
                    </div>

                    <div class="border-b border-gray-200 pb-3 mb-6 mt-4">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <h2 class="text-lg sm:text-xl font-bold text-gray-900 flex items-center gap-2">
                                <svg class="w-5 h-5 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                                Seguros
                            </h2>
                            <button type="button" onclick="addSeguroRow()" class="no-pdf px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-semibold rounded-lg border border-blue-200 transition-colors flex items-center gap-1">
                                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                Adicionar Seguro
                            </button>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-1.5">
                            Gastos com Seguros
                            <div class="relative group inline-block" tabindex="0">
                                <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-48 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                    Carro, plano de saúde, etc.
                                </div>
                            </div>
                        </label>
                        <div id="segurosContainer" class="space-y-3">
                            <!-- Linhas inseridas via JS -->
                        </div>
                    </div>
                </div>

                <!-- STEP 3: GASTOS & PADRÃO DE VIDA -->
                <div class="step" data-step="3">
                    <div class="border-b border-gray-200 pb-3 mb-6">
                        <h2 class="text-lg sm:text-xl font-bold text-gray-900 flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Gastos
                        </h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <div class="pdf-field-group">
                            <label class="text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                                Gastos Fixos
                                <div class="relative group inline-block" tabindex="0">
                                    <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-64 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                        Alimentação, Aluguel, Condomínio, Água, Luz, Telefone, Gás, Gasolina, Vestuário, impostos, etc.
                                    </div>
                                </div>
                            </label>
                            <input type="text" name="gastos_fixos" inputmode="numeric" class="currency-input w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="R$ 0,00">
                        </div>

                        <div class="pdf-field-group">
                            <label class="inline-flex items-center gap-2 cursor-pointer pt-2 sm:pt-6">
                                <span class="text-sm font-medium text-gray-700 flex items-center gap-1.5">
                                    Garantir gastos para partilha dos bens
                                    <div class="relative group inline-block" tabindex="0">
                                        <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-64 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                            Sua família terá gastos com inventário para partilha dos bens. Para você é importante garantir que esse valor fique garantido / protegido?
                                        </div>
                                    </div>
                                </span>
                                <input type="checkbox" name="garantir_partilha_bens" class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500 flex-shrink-0">
                            </label>
                        </div>

                        <div class="pdf-field-group">
                            <label class="text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                                Gastos com Lazer
                                <div class="relative group inline-block" tabindex="0">
                                    <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-56 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                        Passeios, férias, festas, restaurantes, etc
                                    </div>
                                </div>
                            </label>
                            <input type="text" name="gastos_lazer" inputmode="numeric" class="currency-input w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="R$ 0,00">
                        </div>

                        <div class="hidden md:block"></div>

                        <div class="pdf-field-group">
                            <label class="text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                                Outros Gastos
                                <div class="relative group inline-block" tabindex="0">
                                    <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-48 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                        Ajuda financeira, etc
                                    </div>
                                </div>
                            </label>
                            <input type="text" name="outros_gastos" inputmode="numeric" class="currency-input w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="R$ 0,00">
                        </div>
                    </div>

                    <div class="border-b border-gray-200 pb-3 mb-6 mt-4">
                        <h2 class="text-lg sm:text-xl font-bold text-gray-900 flex items-center gap-2">
                            <svg class="w-5 h-5 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                            Padrão de vida
                        </h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="md:col-span-2 pdf-field-group">
                            <label class="text-sm font-medium text-gray-700 mb-1 flex items-center gap-1.5">
                                Anos Padrão de Vida em Ausência
                                <div class="relative group inline-block" tabindex="0">
                                    <svg class="w-4 h-4 text-gray-400 hover:text-blue-600 cursor-pointer flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block tooltip-box w-72 p-2 bg-gray-800 text-white text-xs rounded-lg shadow-xl z-20 text-center font-normal">
                                        Na sua falta, quantos anos de Padrão de Vida são necessários até que sua família consiga se reestruturar financeiramente?
                                    </div>
                                </div>
                            </label>
                            <input type="number" name="anos_padrao_vida_ausencia" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: 5">
                        </div>

    <script>
        let currentStep = 1;
        const totalSteps = 5;

        function updateStepView() {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
                if (parseInt(step.dataset.step) === currentStep) {
                    step.classList.add('active');
                }
            });

            const percent = (currentStep / totalSteps) * 100;
            document.getElementById('progressBar').style.width = `${percent}%`;

            for (let i = 1; i <= totalSteps; i++) {
                const label = document.getElementById(`stepLabel${i}`);
                if (label) {
                    if (i <= currentStep) {
                        label.classList.add('text-blue-600', 'font-bold');
                        label.classList.remove('text-gray-400');
                    } else {
                        label.classList.remove('text-blue-600', 'font-bold');
                        label.classList.add('text-gray-400');
                    }
                }
            }

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const downloadPdfBtn = document.getElementById('downloadPdfBtn');

            if (currentStep === 1) prevBtn.classList.add('hidden');
            else prevBtn.classList.remove('hidden');

            if (currentStep === totalSteps) {
                nextBtn.classList.add('hidden');
                downloadPdfBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                downloadPdfBtn.classList.add('hidden');
            }
        }

        function nextStep(delta) {
            currentStep += delta;
            if (currentStep < 1) currentStep = 1;
            if (currentStep > totalSteps) currentStep = totalSteps;
            updateStepView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function addSeguroRow(selectedTipo = '', valorVal = '') {
            const container = document.getElementById('segurosContainer');
            
            const div = document.createElement('div');
            div.className = 'flex flex-col sm:flex-row items-stretch sm:items-center gap-2 sm:gap-3 seguro-row pdf-field-group bg-gray-50/50 sm:bg-transparent p-3 sm:p-0 rounded-lg border sm:border-0 border-gray-200';
            div.innerHTML = `
                <select name="seguro_tipo" class="w-full sm:w-1/2 p-2.5 bg-white sm:bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Selecione o Seguro</option>
                    <option value="Carro" ${selectedTipo === 'Carro' ? 'selected' : ''}>Carro</option>
                    <option value="Vida" ${selectedTipo === 'Vida' ? 'selected' : ''}>Vida</option>
                    <option value="Saúde" ${selectedTipo === 'Saúde' ? 'selected' : ''}>Saúde</option>
                    <option value="RCP" ${selectedTipo === 'RCP' ? 'selected' : ''}>RCP</option>
                    <option value="Outros" ${selectedTipo === 'Outros' ? 'selected' : ''}>Outros</option>
                </select>
                <div class="flex items-center gap-2 w-full sm:w-1/2">
                    <input type="text" name="seguro_valor" value="${valorVal}" inputmode="numeric" class="currency-input w-full p-2.5 bg-white sm:bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="R$ 0,00">
                    <button type="button" onclick="this.closest('.seguro-row').remove()" class="no-pdf p-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg border border-red-200 transition-colors flex-shrink-0 flex items-center justify-center" title="Remover">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `;
            container.appendChild(div);
            
            const newInput = div.querySelector('.currency-input');
            newInput.addEventListener('input', handleCurrencyInput);
        }

        function addAtivoRow() {
            const container = document.getElementById('ativosContainer');
            
            const div = document.createElement('div');
            div.className = 'flex flex-col sm:flex-row items-stretch sm:items-center gap-2 sm:gap-3 ativo-row pdf-field-group bg-gray-50/50 sm:bg-transparent p-3 sm:p-0 rounded-lg border sm:border-0 border-gray-200';
            div.innerHTML = `
                <select name="ativo_tipo" class="w-full sm:w-1/3 p-2.5 bg-white sm:bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Selecione o tipo</option>
                    <option value="Imóvel">Imóvel</option>
                    <option value="Veículo">Veículo</option>
                    <option value="Participação Societária">Participação Societária</option>
                    <option value="Bens de luxo / colecionáveis">Bens de luxo / colecionáveis</option>
                    <option value="Outros">Outros</option>
                </select>
                <input type="text" name="ativo_descricao" class="w-full sm:w-1/3 p-2.5 bg-white sm:bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Descrição (ex: Apartamento)">
                <div class="flex items-center gap-2 w-full sm:w-1/3">
                    <input type="text" name="ativo_valor" inputmode="numeric" class="currency-input w-full p-2.5 bg-white sm:bg-gray-50 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="R$ 0,00">
                    <button type="button" onclick="this.closest('.ativo-row').remove()" class="no-pdf p-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg border border-red-200 transition-colors flex-shrink-0 flex items-center justify-center" title="Remover">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `;
            container.appendChild(div);
            
            const newInput = div.querySelector('.currency-input');
            newInput.addEventListener('input', handleCurrencyInput);
        }

        function handleCurrencyInput(e) {
            let val = e.target.value.replace(/\D/g, '');
            if (!val) { e.target.value = ''; return; }
            let floatVal = (parseFloat(val) / 100).toFixed(2);
            e.target.value = 'R$ ' + floatVal.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        document.addEventListener('DOMContentLoaded', () => {
            addSeguroRow();
            addAtivoRow();
            
            // Máscaras de entrada
            document.querySelectorAll('input[name="telefone"]').forEach(input => {
                input.addEventListener('input', (e) => {
                    let v = e.target.value.replace(/\D/g, '');
                    if (v.length > 11) v = v.slice(0, 11);
                    if (v.length > 10) e.target.value = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
                    else if (v.length > 6) e.target.value = `(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`;
                    else if (v.length > 2) e.target.value = `(${v.slice(0,2)}) ${v.slice(2)}`;
                    else if (v.length > 0) e.target.value = `(${v}`;
                    else e.target.value = '';
                });
            });

            document.querySelectorAll('.peso-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    let val = e.target.value.replace(/\D/g, '');
                    e.target.value = val ? val + ' kg' : '';
                });
            });

            document.querySelectorAll('.altura-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    let val = e.target.value.replace(/\D/g, '');
                    e.target.value = val ? val + ' cm' : '';
                });
            });

            document.querySelectorAll('.currency-input').forEach(input => {
                input.addEventListener('input', handleCurrencyInput);
            });
        });

        // FUNÇÃO DE GERAÇÃO DO PDF USANDO pdfmake
        function generateNativePDF() {
            const btn = document.getElementById('downloadPdfBtn');
            const originalLabel = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Gerando PDF...';

            const now = new Date();
            
            // Definição da estrutura do Documento
            const docDefinition = {
                content: [
                    { text: 'Relatório KYC & Planejamento Financeiro', style: 'header' },
                    { text: 'Resumo de Dados Cadastrais e Mapeamento de Riscos', style: 'subheader' },
                    { text: 'Data de Emissão: ' + now.toLocaleDateString('pt-BR'), alignment: 'right', margin: [0, 0, 0, 20] }
                ],
                styles: {
                    header: { fontSize: 18, bold: true, margin: [0, 0, 0, 5] },
                    subheader: { fontSize: 12, color: '#475569', margin: [0, 0, 0, 5] },
                    sectionTitle: { fontSize: 14, bold: true, color: '#0f172a', margin: [0, 15, 0, 10] },
                    fieldLabel: { fontSize: 10, bold: true, color: '#475569', margin: [0, 5, 0, 2] },
                    fieldValue: { fontSize: 12, margin: [0, 0, 0, 10] },
                    line: { margin: [0, 5, 0, 15] }
                },
                defaultStyle: { font: 'Roboto' }
            };

            // Iterar pelas abas e extrair todos os títulos e campos em ordem
            document.querySelectorAll('#kycForm .step').forEach(step => {
                
                // Pega todos os H2 (títulos de seção), campos normais e as áreas dinâmicas (seguros/ativos)
                const elements = step.querySelectorAll('h2, .pdf-field-group, #segurosContainer, #ativosContainer');
                
                let processedSeguros = false;
                let processedAtivos = false;

                elements.forEach(el => {
                    // 1. É UM TÍTULO DE SEÇÃO
                    if (el.tagName === 'H2') {
                        let sectionTitle = el.textContent.replace(/\s+/g, ' ').trim();
                        docDefinition.content.push({ text: sectionTitle, style: 'sectionTitle' });
                        docDefinition.content.push({ canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 1, lineColor: '#e2e8f0' }], style: 'line' });
                    } 
                    
                    // 2. É A ÁREA DE SEGUROS DINÂMICOS
                    else if (el.id === 'segurosContainer') {
                        if (processedSeguros) return;
                        processedSeguros = true;
                        
                        const rows = el.querySelectorAll('.seguro-row');
                        let summary = [];
                        rows.forEach(row => {
                            const select = row.querySelector('select');
                            const input = row.querySelector('input');
                            const tipo = select?.options[select.selectedIndex]?.text || '';
                            const valor = input?.value || '';
                            if (tipo && tipo !== 'Selecione o Seguro' && tipo !== 'Selecione') {
                                summary.push(`${tipo}: ${valor || 'R$ 0,00'}`);
                            }
                        });
                        
                        if (summary.length > 0) {
                            docDefinition.content.push({ text: 'Gastos com Seguros (Resumo)', style: 'fieldLabel' });
                            docDefinition.content.push({ text: summary.join(' | '), style: 'fieldValue' });
                        }
                    }

                    // 3. É A ÁREA DE ATIVOS NÃO FINANCEIROS DINÂMICOS
                    else if (el.id === 'ativosContainer') {
                        if (processedAtivos) return;
                        processedAtivos = true;
                        
                        const rows = el.querySelectorAll('.ativo-row');
                        let summary = [];
                        rows.forEach(row => {
                            const select = row.querySelector('select');
                            const inputDesc = row.querySelector('input[name="ativo_descricao"]');
                            const inputValor = row.querySelector('input[name="ativo_valor"]');
                            
                            const tipo = select?.options[select.selectedIndex]?.text || '';
                            const desc = inputDesc?.value || '';
                            const valor = inputValor?.value || '';
                            
                            if (tipo && tipo !== 'Selecione o tipo' && tipo !== 'Selecione') {
                                let itemStr = tipo;
                                if (desc) itemStr += ` (${desc})`;
                                itemStr += `: ${valor || 'R$ 0,00'}`;
                                summary.push(itemStr);
                            }
                        });
                        
                        if (summary.length > 0) {
                            docDefinition.content.push({ text: 'Relação de Ativos', style: 'fieldLabel' });
                            summary.forEach(item => {
                                docDefinition.content.push({ text: '• ' + item, style: 'fieldValue' });
                            });
                        }
                    }
                    
                    // 4. SÃO OS CAMPOS NORMAIS
                    else if (el.classList.contains('pdf-field-group')) {
                        // Ignora os campos se eles estiverem dentro das áreas dinâmicas já processadas
                        if (el.closest('#segurosContainer') || el.closest('#ativosContainer')) return;

                        const labelEl = el.querySelector('label');
                        const field = el.querySelector('input, select, textarea');
                        if (!field) return;

                        let labelText = field.name;
                        if (labelEl) {
                            let clone = labelEl.cloneNode(true);
                            let tooltip = clone.querySelector('.relative'); 
                            if (tooltip) tooltip.remove(); 
                            labelText = clone.textContent.replace(/\s+/g, ' ').trim();
                        }

                        let value = '';
                        if (field.tagName === 'SELECT') {
                            value = field.options[field.selectedIndex]?.text || '';
                            if (value === '--Nenhum--' || value === 'Selecione') value = '-';
                        } else if (field.type === 'checkbox') {
                            value = field.checked ? 'Sim' : 'Não';
                        } else {
                            value = field.value || '-';
                        }

                        docDefinition.content.push({ text: labelText, style: 'fieldLabel' });
                        docDefinition.content.push({ text: value, style: 'fieldValue' });
                    }
                });
            });

            try {
                pdfMake.createPdf(docDefinition).download('formulario-kyc.pdf');
            } catch (err) {
                alert('Erro ao gerar o arquivo PDF.');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalLabel;
            }
        }
    </script>
</body>
</html>
